repos:
  - repo: local
    hooks:
      - id: format
        name: Format (uv)
        entry: uv format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]
      - id: worktree-symlinks
        name: Symlink sbt.db and data/ in worktrees
        entry: hooks/post-checkout-symlinks.sh
        language: unsupported_script
        stages: [post-checkout]
        always_run: true
