[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbt"
version = "0.1.0"
description = "sbOogway's backtest tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ccxt>=4.5.56",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "nautilus-trader[visualization]>=1.230.0",
    "optuna>=4.9.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "pre-commit>=3.2",
    "pytest>=9.1.1",
]

[project.scripts]
sbt = "sbt.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
